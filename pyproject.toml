[project]
name = "tester-webapp"
version = "0.1.0"
description = "Multiple-choice self-test app for any question bank, organised by module and knowledge point"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "jinja2>=3.1.6",
    "sqlmodel>=0.0.49",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
